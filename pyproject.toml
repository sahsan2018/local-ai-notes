[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-notes"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "argon2-cffi>=23.1,<26", "jinja2>=3.1,<4", "markdown-it-py>=3,<5", "bleach>=6,<7", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright>=1.55,<2"]

[project.scripts]
notes = "local_ai_notes.cli:main"
notes-recovery = "local_ai_notes.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_ai_notes = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real-browser acceptance smoke tests"]
