<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Local AI Notes</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-shell"><main class="login-card"><h1>Local AI Notes</h1><p>Sign in to your local notebook.</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></main></body></html>
